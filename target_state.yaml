cargo:
  # https://github.com/01mf02/jaq/releases
  jaq: cargo +1.100.0 install jaq --version 3.1.2
  # https://github.com/prefix-dev/pixi/blob/main/CHANGELOG.md
  pixi: cargo +1.100.0 install pixi --git https://github.com/prefix-dev/pixi --tag v0.84.2
pixi:
  # 2026-05-07: With opam 2.5.0, `opam pin` fails to get `rocq-prover 9.0.0`:
  #   [ERROR] Package rocq-prover has no known version 9.0.0 in the repositories
  #   But maybe this is related to https://github.com/ocaml/opam-repository/issues/28994#issuecomment-3600780785
  #   Maybe Rocq should be installed with: https://opam.ocaml.org/packages/rocq-stdlib/
  # https://github.com/ocaml/opam/releases
  opam: pixi global install opam=2.1.3
  # https://github.com/astral-sh/uv/blob/main/CHANGELOG.md
  uv: pixi global install uv=0.13.7
